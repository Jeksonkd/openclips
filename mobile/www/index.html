<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>OpenClips</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <div id="home-screen" class="screen">
    <div class="home-brand">OpenClips</div>
    <div class="home-tagline">Quick edits, on the go</div>
    <button id="btn-import-home" class="fab-import">+ New Project</button>
  </div>

  <div id="editor-screen" class="screen hidden">
    <div id="preview-wrap">
      <video id="preview-video" playsinline muted></video>
      <div id="no-clip-hint">Add a clip to begin</div>
    </div>

    <div id="scrub-row">
      <button id="btn-playpause" class="play-btn">▶</button>
      <span id="time-readout">00:00 / 00:00</span>
    </div>

    <div id="timeline-scroll">
      <div id="timeline-track"></div>
      <div id="timeline-playhead"></div>
    </div>

    <div id="bottom-toolbar">
      <button class="tool-btn" id="tool-add"><span class="icon">＋</span><span class="label">Add</span></button>
      <button class="tool-btn" id="tool-split"><span class="icon">✂</span><span class="label">Split</span></button>
      <button class="tool-btn" id="tool-delete"><span class="icon">🗑</span><span class="label">Delete</span></button>
      <button class="tool-btn" id="tool-transition"><span class="icon">◐</span><span class="label">Transition</span></button>
      <button class="tool-btn primary" id="tool-export"><span class="icon">⬆</span><span class="label">Export</span></button>
    </div>
  </div>

</div>

<div id="sheet-backdrop" class="backdrop hidden"></div>

<div id="add-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Add</div>
  <div class="sheet-options">
    <button class="sheet-option" data-add="media">
      <span class="sheet-option-icon">🎬</span><span>Media</span>
    </button>
    <button class="sheet-option" data-add="text">
      <span class="sheet-option-icon">T</span><span>Text</span>
    </button>
    <button class="sheet-option" data-add="effect">
      <span class="sheet-option-icon">✨</span><span>Effect</span>
    </button>
  </div>
</div>

<div id="transition-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Transition</div>
  <div class="sheet-options">
    <button class="sheet-option" data-type="none">
      <span class="sheet-option-icon">∅</span><span>None</span>
    </button>
    <button class="sheet-option" data-type="fade">
      <span class="sheet-option-icon">◐</span><span>Fade</span>
    </button>
  </div>
</div>

<div id="effect-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Effect</div>
  <div class="sheet-options wrap" id="effect-options"></div>
</div>

<div id="text-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Add Text</div>
  <textarea id="text-input" class="text-input" placeholder="Type something…" rows="2"></textarea>
  <div class="field-row">
    <label>Color</label>
    <input type="color" id="text-color-input" value="#ffffff" />
  </div>
  <button id="text-sheet-add" class="sheet-primary-btn">Add</button>
</div>

<div id="props-sheet" class="sheet props-sheet hidden">
  <div class="sheet-handle"></div>
  <div class="props-tabs" id="props-tabs">
    <button class="props-tab active" data-tab="adjust">Adjust</button>
    <button class="props-tab" data-tab="effect">Effect</button>
    <button class="props-tab" data-tab="mask">Mask &amp; Blend</button>
  </div>
  <div class="props-body" id="props-body"></div>
</div>

<div id="export-modal" class="modal hidden">
  <div class="modal-box">
    <div id="export-icon">⬆</div>
    <div id="export-status">Exporting…</div>
    <div class="progress-track"><div class="progress-fill" id="export-progress-fill"></div></div>
    <button id="export-done-btn" class="hidden">Done</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
